name: Testing environment setup and build

on:
  push:
    branches:
      - main
  pull_request_target:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: choij1589/private-el9:full
      options: --user root
      env:
        USER: root

    steps:
      - name: Setup SSH for CERN GitLab
        shell: bash
        env: 
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"

          install -d -m 700 /root/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > /root/.ssh/id_ed25519
          chmod 600 /root/.ssh/id_ed25519
          ssh-keyscan -p 7999 gitlab.cern.ch >> /root/.ssh/known_hosts
          chmod 644 /root/.ssh/known_hosts

          cat > /root/.ssh/config <<'EOF'
          Host gitlab.cern.ch
            HostName gitlab.cern.ch
            Port 7999
            User git
            IdentityFile /root/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 /root/.ssh/config
          ssh -o BatchMode=yes -T git@gitlab.cern.ch || true
          
          git ls-remote \
           ssh://git@gitlab.cern.ch:7999/choij/jsonpog-integration.git \
           HEAD
          
      - name: Checkout Code
        uses: actions/checkout@v4
        env:
          GIT_SSH_COMMAND: >-
           ssh
           -i /root/.ssh/id_ed25519
           -o IdentitiesOnly=yes
           -o StrictHostKeyChecking=yes
           -o UserKnownHostsFile=/root/.ssh/known_hosts
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup and Build
        run: source ./setup.sh && ./scripts/build.sh
